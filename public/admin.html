<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store Admin | Rahmat Ullah & Abdullah</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--deep:#103b25;--green:#187a49;--cream:#f5f7f3;--ink:#1d2b22;--muted:#66756a;--line:#dce5dc}*{box-sizing:border-box;margin:0}body{font:14px Poppins,sans-serif;background:var(--cream);color:var(--ink)}.bar{padding:17px 0;color:#fff;background:var(--deep)}.wrap{width:min(1050px,calc(100% - 32px));margin:auto}.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;line-height:1.25}.brand span{color:#e6b647}.logout{padding:8px 12px;border:1px solid #89ad98;border-radius:6px;color:#fff;background:transparent;cursor:pointer}.login{display:grid;min-height:100vh;place-items:center;padding:20px}.login-card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(24,54,35,.08)}.login-card{width:min(400px,100%);padding:30px}.login-card h1{color:var(--deep);font-size:1.5rem}.login-card p{margin:6px 0 20px;color:var(--muted);font-size:.85rem}.app{padding:34px 0 60px}.app>p{margin:6px 0 25px;color:var(--muted)}.layout{display:grid;grid-template-columns:360px 1fr;gap:22px}.panel{padding:22px}.panel h2{margin-bottom:16px;color:var(--deep);font-size:1.05rem}label{display:block;margin:12px 0 5px;font-weight:600;font-size:.78rem}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;outline-color:var(--green);font:inherit}textarea{min-height:76px;resize:vertical}.button{margin-top:16px;padding:10px 14px;border:0;border-radius:6px;color:#fff;background:var(--green);font:600 .82rem Poppins,sans-serif;cursor:pointer}.button:hover{background:#10663a}.notice{min-height:20px;margin-top:11px;color:var(--green);font-size:.76rem;font-weight:600}.error{color:#b52c2c}.product-list{display:grid;gap:10px}.product{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px}.product img{width:58px;height:53px;object-fit:cover;border-radius:5px}.product strong{display:block;font-size:.84rem}.product span{color:var(--muted);font-size:.74rem}.delete{padding:7px 9px;border:1px solid #e8bcbc;border-radius:5px;color:#ab2d2d;background:#fff;cursor:pointer;font-size:.72rem}.hidden{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.app{padding-top:24px}.panel{padding:18px}}</style></head><body><div id="login" class="login"><form class="login-card" id="login-form"><h1>Store admin</h1><p>Sign in to update your products and shop information.</p><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required><button class="button" type="submit">Sign in securely</button><p class="notice error" id="login-message"></p></form></div><div id="dashboard" class="hidden"><header class="bar"><div class="wrap"><div class="brand"><span>RA</span> RAHMAT ULLAH &amp; ABDULLAH<br>ATTA DEALERS · ADMIN</div><button class="logout" id="logout">Sign out</button></div></header><main class="wrap app"><h1>Manage your shop</h1><p>Changes are saved immediately and appear on the storefront.</p><div class="layout"><section class="panel"><h2>Shop details</h2><form id="store-form"><label>Name</label><input name="name" required><label>Phone</label><input name="phone" required><label>Email</label><input name="email" type="email" required><label>Address</label><textarea name="address" required></textarea><label>Delivery note</label><textarea name="delivery" required></textarea><button class="button">Save shop details</button><p class="notice" id="store-message"></p></form></section><section class="panel"><h2>Add a product</h2><form id="product-form"><label>Product name</label><input name="name" maxlength="60" required><label>Price</label><input name="price" maxlength="40" placeholder="Rs. 150 / Kg" required><label>HTTPS image URL</label><input name="image" type="url" placeholder="https://..." required><button class="button">Add product</button><p class="notice" id="product-message"></p></form><h2 style="margin-top:28px">Current products</h2><div id="products" class="product-list"></div></section></div></main></div><script>let csrf='',data;const $=s=>document.querySelector(s);const msg=(id,text,error=false)=>{const el=$(id);el.textContent=text;el.classList.toggle('error',error)};const request=async(url,options={})=>{const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,...options.headers}});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j};function render(){const form=$('#store-form');for(const [k,v]of Object.entries(data.store))form.elements[k].value=v;$('#products').replaceChildren(...data.products.map(p=>{const row=document.createElement('div');row.className='product';const img=document.createElement('img');img.src=p.image;img.alt='';const text=document.createElement('div');text.innerHTML=`<strong></strong><span></span>`;text.querySelector('strong').textContent=p.name;text.querySelector('span').textContent=p.price;const del=document.createElement('button');del.className='delete';del.textContent='Delete';del.onclick=async()=>{if(!confirm(`Delete ${p.name}?`))return;try{await request('/api/admin/products/'+encodeURIComponent(p.id),{method:'DELETE'});data.products=data.products.filter(x=>x.id!==p.id);render()}catch(e){alert(e.message)}};row.append(img,text,del);return row}))}async function start(){try{const r=await request('/api/admin/session');csrf=r.csrf;data=r.data;$('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');render()}catch{}}$('#login-form').onsubmit=async e=>{e.preventDefault();try{const r=await request('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});csrf=r.csrf;$('#password').value='';await start()}catch(e){msg('#login-message',e.message,true)}};$('#store-form').onsubmit=async e=>{e.preventDefault();try{const store=Object.fromEntries(new FormData(e.target));const r=await request('/api/admin/store',{method:'PUT',body:JSON.stringify(store)});data.store=r.store;msg('#store-message','Saved successfully.')}catch(e){msg('#store-message',e.message,true)}};$('#product-form').onsubmit=async e=>{e.preventDefault();try{const r=await request('/api/admin/products',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});data.products.push(r.product);e.target.reset();render();msg('#product-message','Product added.')}catch(e){msg('#product-message',e.message,true)}};$('#logout').onclick=async()=>{try{await request('/api/admin/logout',{method:'POST'});}finally{location.reload()}};start();</script></body></html>
